<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found | Sangram Keshari Ghose</title>
<meta name="description" content="That page does not exist. Head back to the portfolio of Sangram Keshari Ghose — Data Engineer, Solutions, and Agentic AI." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#07070f" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script>
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
<style>
:root {
  --bg: #07070f; --surface: #12122a; --border: rgba(99,102,241,.16);
  --border-strong: rgba(99,102,241,.42); --fg: #f0f1ff; --muted: #9b9fc4;
  --grad: linear-gradient(125deg,#67e8f9 0%,#6366f1 45%,#c084fc 100%);
}
[data-theme="light"] {
  --bg: #f5f6fb; --surface: #ffffff; --border: rgba(79,70,229,.12);
  --border-strong: rgba(79,70,229,.32); --fg: #0e0e24; --muted: #5c6188;
  --grad: linear-gradient(125deg,#22d3ee 0%,#4f46e5 45%,#a855f7 100%);
}
*,*::before,*::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  background: var(--bg); color: var(--fg); text-align: center; padding: 32px;
  font-family: "Plus Jakarta Sans", system-ui, sans-serif; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
.mesh {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .45;
  background:
    radial-gradient(50rem 36rem at 12% -8%, rgba(99,102,241,.45), transparent 60%),
    radial-gradient(40rem 32rem at 88% 8%, rgba(168,85,247,.22), transparent 60%);
}
.code {
  font-family: Syne, system-ui, sans-serif; font-weight: 800; letter-spacing: -.04em;
  font-size: clamp(4.5rem, 18vw, 9rem); line-height: 1; margin: 0;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
h1 { font-family: Syne, system-ui, sans-serif; font-size: 1.5rem; margin: 14px 0 8px; letter-spacing: -.03em; }
p { color: var(--muted); max-width: 34rem; margin: 0 auto 24px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn {
  display: inline-flex; align-items: center; padding: 11px 20px; border-radius: 13px;
  font-weight: 700; font-size: .875rem; text-decoration: none;
  color: #fff; background: var(--grad); border: 1px solid transparent;
}
.btn-ghost { background: var(--surface); color: var(--fg); border-color: var(--border-strong); }
</style>
</head>
<body>
  <div class="mesh" aria-hidden="true"></div>
  <main>
    <p class="code">404</p>
    <h1>This page moved, or never existed</h1>
    <p>The link is broken, but the work is not. Head to the portfolio home page or jump straight into a case study.</p>
    <div class="row">
      <a class="btn" href="/">Go to home</a>
      <a class="btn btn-ghost" href="/#projects">View projects</a>
      <a class="btn btn-ghost" href="mailto:sangramkesharighose@gmail.com">Email me</a>
    </div>
  </main>
</body>
</html>
